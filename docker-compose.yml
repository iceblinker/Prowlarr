services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:-nordvpn}
      - VPN_TYPE=${VPN_TYPE:-openvpn}
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - FIREWALL_OUTBOUND_SUBNETS=172.0.0.0/8,10.0.0.0/8,192.168.0.0/16
      - TZ=${TZ:-Etc/UTC}
    ports:
      - "${PROWLARR_PORT:-9696}:9696" # Prowlarr - Moved to Prowlarr container directly
      - "8191:8191" # FlareSolverr
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # For autoheal if needed
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - default
      - ai_network
    labels:
      - autoheal=true

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: service:gluetun
    # ports:
    #   - "${PROWLARR_PORT:-9696}:9696"
    # networks:
    #   - default
    #   - ai_network
    healthcheck:
      test: curl -f http://localhost:9696/health || exit 1
      interval: 1m
      retries: 3
      start_period: 10s
      timeout: 5s
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - PROWLARR_API_KEY=${PROWLARR_API_KEY}
      - PROWLARR__POSTGRES__HOST=prowlarr-postgres
      - PROWLARR__POSTGRES__PORT=5432
      - PROWLARR__POSTGRES__USER=${POSTGRES_USER}
      - PROWLARR__POSTGRES__PASSWORD=${POSTGRES_PASSWORD}
      - PROWLARR__POSTGRES__MAINDB=prowlarr_main
      - PROWLARR__POSTGRES__LOGDB=prowlarr_log
    volumes:
      - ./config/prowlarr:/config
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  nzbhydra:
    image: hotio/nzbhydra2
    container_name: nzbhydra
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ./config/nzbhydra:/config
    ports:
      - "5076:5076"
    restart: unless-stopped
    depends_on:
      - gluetun

  # --- Radarr Instances ---
  radarr-en:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr-en
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - RADARR__AUTH__APIKEY=${RADARR_API_KEY}
      - RADARR__POSTGRES__HOST=prowlarr-postgres
      - RADARR__POSTGRES__PORT=5432
      - RADARR__POSTGRES__USER=${POSTGRES_USER}
      - RADARR__POSTGRES__PASSWORD=${POSTGRES_PASSWORD}
      - RADARR__POSTGRES__MAINDB=radarr_en
      - RADARR__POSTGRES__LOGDB=radarr_en_log
    volumes:
      - ./config/radarr-en:/config
      - ./media:/media
    ports:
      - "7878:7878"
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped
    networks:
      - ai_network
      - default

  radarr-es:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr-es
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - RADARR__AUTH__APIKEY=${RADARR_API_KEY}
      - RADARR__POSTGRES__HOST=prowlarr-postgres
      - RADARR__POSTGRES__PORT=5432
      - RADARR__POSTGRES__USER=${POSTGRES_USER}
      - RADARR__POSTGRES__PASSWORD=${POSTGRES_PASSWORD}
      - RADARR__POSTGRES__MAINDB=radarr_es
      - RADARR__POSTGRES__LOGDB=radarr_es_log
    volumes:
      - ./config/radarr-es:/config
      - ./media:/media
    ports:
      - "7879:7878"
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped
    networks:
      - ai_network
      - default

  radarr-it:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr-it
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - RADARR__AUTH__APIKEY=${RADARR_API_KEY}
      - RADARR__POSTGRES__HOST=prowlarr-postgres
      - RADARR__POSTGRES__PORT=5432
      - RADARR__POSTGRES__USER=${POSTGRES_USER}
      - RADARR__POSTGRES__PASSWORD=${POSTGRES_PASSWORD}
      - RADARR__POSTGRES__MAINDB=radarr_it
      - RADARR__POSTGRES__LOGDB=radarr_it_log
    volumes:
      - ./config/radarr-it:/config
      - ./media:/media
    ports:
      - "7880:7878"
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped
    networks:
      - ai_network
      - default

  # --- Sonarr Instances ---
  sonarr-en:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr-en
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - SONARR__AUTH__APIKEY=${SONARR_API_KEY}
      - SONARR__POSTGRES__HOST=prowlarr-postgres
      - SONARR__POSTGRES__PORT=5432
      - SONARR__POSTGRES__USER=${POSTGRES_USER}
      - SONARR__POSTGRES__PASSWORD=${POSTGRES_PASSWORD}
      - SONARR__POSTGRES__MAINDB=sonarr_en
      - SONARR__POSTGRES__LOGDB=sonarr_en_log
    volumes:
      - ./config/sonarr-en:/config
      - ./media:/media
    ports:
      - "8989:8989"
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped
    networks:
      - ai_network
      - default

  sonarr-es:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr-es
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - SONARR__AUTH__APIKEY=${SONARR_API_KEY}
      - SONARR__POSTGRES__HOST=prowlarr-postgres
      - SONARR__POSTGRES__PORT=5432
      - SONARR__POSTGRES__USER=${POSTGRES_USER}
      - SONARR__POSTGRES__PASSWORD=${POSTGRES_PASSWORD}
      - SONARR__POSTGRES__MAINDB=sonarr_es
      - SONARR__POSTGRES__LOGDB=sonarr_es_log
    volumes:
      - ./config/sonarr-es:/config
      - ./media:/media
    ports:
      - "8990:8989"
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped
    networks:
      - ai_network
      - default

  sonarr-it:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr-it
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - SONARR__AUTH__APIKEY=${SONARR_API_KEY}
      - SONARR__POSTGRES__HOST=prowlarr-postgres
      - SONARR__POSTGRES__PORT=5432
      - SONARR__POSTGRES__USER=${POSTGRES_USER}
      - SONARR__POSTGRES__PASSWORD=${POSTGRES_PASSWORD}
      - SONARR__POSTGRES__MAINDB=sonarr_it
      - SONARR__POSTGRES__LOGDB=sonarr_it_log
    volumes:
      - ./config/sonarr-it:/config
      - ./media:/media
    ports:
      - "8991:8989"
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped
    networks:
      - ai_network
      - default

  # --- Helpers ---
  recyclarr:
    image: recyclarr/recyclarr
    container_name: recyclarr
    user: 1000:1000
    volumes:
      - ./config/recyclarr:/config
    environment:
      - TZ=${TZ:-Etc/UTC}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - SONARR_API_KEY=${SONARR_API_KEY}
    networks:
      - default
      - ai_network
    depends_on:
      - gluetun
    deploy:
      resources:
        limits:
          memory: 128M

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    network_mode: service:gluetun
    environment:
      - LOG_LEVEL=info
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # --- Monitoring & Dashboard ---
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    volumes:
      - ./config/uptime-kuma:/app/data
    ports:
      - "3005:3001"
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - default
      - ai_network

