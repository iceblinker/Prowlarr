services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - PROWLARR__POSTGRES__HOST=postgres
      - PROWLARR__POSTGRES__PORT=5432
      - PROWLARR__POSTGRES__USER=${POSTGRES_USER}
      - PROWLARR__POSTGRES__PASSWORD=${POSTGRES_PASSWORD}
      - PROWLARR__POSTGRES__MAINDB=${POSTGRES_DB}
    volumes:
      - ./config:/config
    ports:
      - "${PROWLARR_PORT:-9696}:9696"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      - flaresolverr
      - postgres
    networks:
      - default
      - ai_network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9696/ping || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - autoheal=true

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TZ:-Etc/UTC}
    ports:
      - "${FLARESOLVERR_PORT:-8191}:8191"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - default
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8191/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - autoheal=true

  postgres:
    image: postgres:16-alpine
    container_name: prowlarr-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - autoheal=true

  autoheal:
    image: willfarrell/autoheal
    container_name: autoheal
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always

networks:
  ai_network:
    external: true

volumes:
  postgres_data:
